<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
 <title><h1>My Hobby Cards</h1></title> 
 <link rel="stylesheet"
 href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
 <style>
    body {
        background-color: blueviolet;
        font-family: 'Courier New', Courier, monospace;
        padding: 25px;
    }
    h1 {
        text-align:center;
        color: antiquewhite;
    }
    .hobby-card h3 {
        width: 250px;
        background-color: aqua;
        color: black;
    }
 </style>
 </head>
 <body>
    <h3>My hobby card</h3>
    <div class="container">
        <div class="row">
            <div class="col-12 col-md-6 col-lg-4">
                <div class="hobby-card">
                    <h3>Drawing</h3>
                    <p>I like drawing</p>
                </div>
            </div>
            <div class="col-12 col-md-6 col-lg-4">
                <div class="hobby-card">
                    <h3>Football</h3>
                    <p>I like playing football</p>
                </div>
            </div>
            <div class="col-12 col-md-6 col-lg-4">
                <div class="hobby-card">
                    <h3>Reading</h3>
                    <p>I like comics</p>
                </div>
            </div>
        </div> 
    </div>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js">
    </script>
 </body>
 </html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Cartoon Character Card</title>

  <style>
    /* universal selector*/
    *{
       font-size: 16px;
    }

    /* element selector */
    body {
        background-color: blueviolet;
    }
    h1 {
        color:aqua;
    }
    h2 {
        color:beige;
    }
    p{
        color:chocolate;
    }

    /* class selector */
    .cartoon-detail {
        color:crimson;
        font-weight: bold;
    }

    /* ID selector */
    #cartoon-card {
        background-color:blue; 
    }

    </style>
</head>
    <body>
      <h2>My Cartoon Character Card</h2>
      <p style="color:whitesmoke;">MEET MY FRIEND DORA!</p>
      
      <div id="cartoon-card">

        <h4>KNOW MY CHARECTER</h4>
        <p class="cartoon-detail">name:dora</p>
        <p class="cartoon-detail">friend:bujji</p>
        <p class="cartoon-detail">loves:talking to map</p>
        
      </div>
      <h2>WHY DORA?</h2>
      <p>Dora helps children interact with her </p>
      <p>It helps children to discover new things</p>
      <p>It is fun and nice to watch this show</p>
      </body>
      </html>

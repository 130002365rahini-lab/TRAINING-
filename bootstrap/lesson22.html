<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Science Lab</title>
  <link rel="stylesheet"
    href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <style>
        body {
            background-color: lightsalmon;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        }
        .jumbotron {
            background-color: aquamarine;
            border: 20px;
        }
        .jumbotron h1 {
            color: brown;
            text-align: center;
        }
        .section-title {
            font-weight: bold;
            padding: 30px;
        }
    </style>
    </head>
    <body>
        <div class="jumbotron jumbotron-fluid">
            <div class="container">
                <h1>My Science Lab</h1>
                <p class="lead">the world of science with lab!</p>
        
                <button class="btn btn-primary">Chemistry</button>
                <button class="btn btn-success">Biology</button>
                <button class="btn btn-warning">Physics</button>
                <button class="btn btn-danger">Astronomy</button>
            </div>
        </div>
        <h2 class="section-title">Study progress<span class="badge badge-primary">4</span></h2>
        <p>Chemistry
            <span class="badge badge-warning">3 chps done</span></p>
        <p>Biology
            <span class="badge badge-danger">6 chps done</span></p>
        <p>Physics
            <span class="badge badge-info">8 chps done</span></p>
        <p>Astronomy
            <span class="badge badge-success">2 chps done</span></p>
        <div class="progress-bar mb-3">
            <div class="progress-bar badge bg-warning"
        style="width:70%">70%</div>
        </div>
        <div class="progress-bar mb-3">
            <div class="progress-bar badge bg-success"
            style="width: 85%;">85%</div>
        </div>
        <div class="progress-bar mb-3">
            <div class="progress-bar badge bg-info"
            style="width: 90%;">90%</div>
        </div>
        <div class="progress-bar mb-3">
            <div class="progress-bar badge bg-danger"
            style="width: 40%;">40%</div>
        </div>
        <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js">
        </script>
    </body>
</html>

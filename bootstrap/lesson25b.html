<!DOCTYPE html>
<html lang="en">
<head>
  <title>My Jungle Explorer</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">


  <style>
    body { position: relative; }
    .jungle-slide {
      height: 400px;
      text-align: center;
      padding-top: 50px;
      font-size: 1.8rem;
      color: lightseagreen;
    }
    .slide-rainforest { background: blue; }
    .slide-river { background: pink; }
    .slide-night { background: gold; }


    .section {
      padding: 50px 10px;
      min-height: 400px;
    }


    #rainforest { background: coral; }
    #river { background: chocolate; }
    #night { background: purple; }
  </style>
</head>


<body data-spy="scroll" data-target="#jungleNav" data-offset="60">


  <div id="jungleCarousel" class="carousel slide" data-ride="carousel">


    <ol class="carousel-indicators">
      <li data-target="#jungleCarousel" data-slide-to="0" class="active"></li>
      <li data-target="#jungleCarousel" data-slide-to="1"></li>
      <li data-target="#jungleCarousel" data-slide-to="2"></li>
    </ol>


    <div class="carousel-inner">
      <div class="carousel-item active jungle-slide slide-rainforest">
         Rainforest rainbow
      </div>


      <div class="carousel-item jungle-slide slide-river">
         rough river
      </div>


      <div class="carousel-item jungle-slide slide-night">
         Jungle Safari
      </div>
    </div>


    <a class="carousel-control-prev" href="#jungleCarousel" data-slide="prev">
      <span class="carousel-control-prev-icon"></span>
    </a>


    <a class="carousel-control-next" href="#jungleCarousel" data-slide="next">
      <span class="carousel-control-next-icon"></span>
    </a>


  </div>


  <nav id="jungleNav" class="navbar navbar-expand-sm navbar-success bg-success sticky-top">
    <span class="navbar-brand">jolly jungle </span>


    <ul class="navbar-nav">
      <li class="nav-item">
        <a class="nav-link" href="#rainforest">Rainforest ride </a>
      </li>


      <li class="nav-item">
        <a class="nav-link" href="#river">River</a>
      </li>


      <li class="nav-item">
        <a class="nav-link" href="#night">Night Safari</a>
      </li>
    </ul>
  </nav>


  <div class="container">


    <div id="rainforest" class="section">
      <h2>Rainforest rainbow</h2>
      <p>expirence the chill of the forest.</p>
    </div>


    <div id="river" class="section">
      <h2>rough river</h2>
      <p>discover the joy of finding new animals</p>
    </div>


    <div id="night" class="section">
      <h2>Jungle Safari</h2>
      <p>Explore the beautifulnature of forest.</p>
    </div>


  </div>


  <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>


</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <h1>My Superhero Card</h1>
<style>
body{
  background-color:darkblue;
  color:white;
  font-family:arial;  
}
.hero-name{
    font-size: large;
    font-weight:bold;
    color:yellow;
    text-shadow: 8px 8px orange;
}  
.tagline{
    font-style: italic;
    color: lightblue;
    text-transform: capitalize;
}
.label{
    text-transform: uppercase;
    text-decoration: underline;
    color:coral;
}
.power{
    text-decoration: line-through;
}
.weakness{
    text-decoration: line-through;
}

.badge{
    color: golden;
    font-weight: bold;
    font-size: 28px;
    transform: rotate(30 degree);
}
</style>
<body>
    <h2>captain america</h2>
    <p class="tagline">
        i like this charecter very much
    </p>
    <article class="power">
        <ul>
          <li>He can fly</li>
          <li>He can use his shield</li>
        </ul>
    <article class="weakness">
        <p>he is overconfident</p>
    </article>
    <p class="badge">
        captain
    </p>

</body>
</html>




    


</style>
</head>
</html>
